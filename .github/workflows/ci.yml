name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Bash Syntax
        run: bash -n updater.sh

      - name: Run ShellCheck
        run: shellcheck -e SC2034,SC1090 updater.sh

      - name: Run Regression Tests
        run: python3 -m unittest discover -s tests -v
